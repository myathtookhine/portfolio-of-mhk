    <meta name="theme-color" content="#ffffff" />
    <script>
      // Dark 18:00–07:00, unless the visitor picked a theme. Runs before the
      // first paint, so the page never flashes the wrong one. Kept in step
      // afterwards by src/components/ThemeProvider.tsx.
      ;(function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('theme')
          var hour = new Date().getHours()
          theme = saved === 'light' || saved === 'dark' ? saved : hour >= 18 || hour < 7 ? 'dark' : 'light'
        } catch (e) {
          /* Blocked storage: fall back to dark. */
        }
        document.documentElement.dataset.theme = theme
        // Arm reveal-on-scroll before the first paint, so nothing flashes in and out.
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('reveal-ready')
        }
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111214')
        }
      })()
    </script>
